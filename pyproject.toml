[project]
name = "international"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx2>=2.16.0",
    "pandas[excel]>=3.1.0",
    "portolan-cli>=0.9.0",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    "tylertoo>=0.8.0",
]

[dependency-groups]
dev = ["obstore>=0.12.0", "ruff>=0.17.2"]

[tool.uv]
override-dependencies = ["duckdb>=2.0.0"]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "S603", "S607", "S608"]
